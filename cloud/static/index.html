<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Performance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
/* same design tokens as match_report.html (dashboard-redesign §7) */
:root{
  --brand:#C8102E; --brand-strong:#A00D25; --brand-tint:#FDECEF;
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280;
  --line:#E5E7EB; --line-strong:#D1D5DB; --surface:#FFFFFF; --canvas:#F7F7F8; --muted-bg:#F3F4F6;
  --pos:#15803D; --neg:#B45309; --pos-tint:#DCFCE7; --neg-tint:#FEF3C7;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);font-size:14px;line-height:20px;background:var(--canvas);color:var(--ink-2);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:14px}
a{color:var(--brand)}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,3vw,32px);background:var(--surface);border-top:4px solid var(--brand);border-bottom:1px solid var(--line)}
.brand h1{font-size:18px;line-height:24px;font-weight:700;color:var(--ink)}
.brand span{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .who{font-size:12px;line-height:16px;color:var(--ink-3)}
.btn{font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--muted-bg)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.btn-primary:hover{background:var(--brand-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px;line-height:16px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:24px clamp(16px,3vw,32px)}
.section-title{font-size:18px;line-height:24px;font-weight:700;color:var(--ink);border-left:3px solid var(--brand);padding-left:12px;margin:8px 0 4px}
.section-sub{font-size:12px;line-height:16px;color:var(--ink-3);margin:0 0 16px 15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.card h3{font-size:14px;line-height:20px;font-weight:600;color:var(--ink);margin-bottom:12px}
.narrow{max-width:420px;margin:48px auto}
label{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
input[type=email],input[type=password],input[type=text],input[type=url],input[type=search],input[type=number],select{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:10px 12px;color:var(--ink);background:var(--surface)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:200px}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.msg{font-size:14px;line-height:20px;margin-top:12px}
.msg.err{color:var(--neg);font-weight:600}
.msg.ok{color:var(--pos);font-weight:600}
.caption{font-size:12px;line-height:16px;color:var(--ink-3)}
.links{margin-top:16px;font-size:12px;line-height:16px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
.notice{border-left:3px solid var(--neg);background:var(--neg-tint);color:var(--neg);padding:8px 12px;border-radius:4px;margin-bottom:16px;font-size:12px;line-height:16px;font-weight:600}
.progress{height:6px;background:var(--muted-bg);border-radius:3px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:var(--brand);width:0;transition:width .3s ease}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;line-height:16px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:none}
.match-name{font-weight:600;color:var(--ink);text-decoration:none}
.match-name:hover{color:var(--brand)}
.score{font-weight:700;color:var(--ink);padding:0 8px}
.tag{display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:4px}
.tag.pos{background:var(--pos-tint);color:var(--pos)}
.tag.neg{background:var(--neg-tint);color:var(--neg)}
.tag.neutral{background:var(--muted-bg);color:var(--ink-2)}
.table-wrap{overflow-x:auto}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.hidden{display:none !important}
@media(max-width:600px){.hide-sm{display:none}}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><h1>Match Performance</h1><span>Post-match analysis · Flashscore data</span></div>
  <nav class="nav" id="nav"></nav>
</header>
<main id="view" aria-live="polite"></main>

<script>
/* ============================================================
   Cloud shell: sign-in, library, admin (design doc cloud §11).
   Every server value is escaped before it touches innerHTML.
   ============================================================ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cookie=name=>{const m=document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'));return m?decodeURIComponent(m[1]):'';};
const FLASH_URL_RE=/^https:\/\/(www\.)?flashscore\.com\/match\/football\//i;
let ME=null;

async function api(method,path,body){
  const headers={'Accept':'application/json'};
  if(body!==undefined) headers['Content-Type']='application/json';
  if(method!=='GET') headers['X-CSRF-Token']=cookie('fs_csrf');
  let r;
  try{ r=await fetch(path,{method,headers,credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(e){ throw new Error('Cannot reach the server. Check your connection.'); }
  const j=await r.json().catch(()=>null);
  if(!r.ok){ const e=(j&&j.error)||{}; const err=new Error((e.message||('Server error '+r.status))+(e.hint?' '+e.hint:'')); err.code=e.code; err.status=r.status; throw err; }
  return j;
}
const view=document.getElementById('view');
const setMsg=(id,text,ok)=>{const el=document.getElementById(id); if(el){el.textContent=text||''; el.className='msg '+(text?(ok?'ok':'err'):'');}};
const fmtDate=iso=>{if(!iso) return ''; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};

/* ---------- nav ---------- */
function renderNav(){
  const nav=document.getElementById('nav');
  if(!ME){ nav.innerHTML=`<a class="btn btn-sm" href="#/login">Sign in</a>`; return; }
  const u=ME.user;
  nav.innerHTML=`<span class="who">${esc(u.email)}${u.role==='admin'?' · admin':''}</span>
    <a class="btn btn-sm" href="#/">Library</a>
    <a class="btn btn-sm" href="/report">New report</a>
    ${u.role==='admin'?'<a class="btn btn-sm" href="#/admin">Admin</a>':''}
    <a class="btn btn-sm" href="#/account">Account</a>
    <button class="btn btn-sm" id="btnSignOut">Sign out</button>`;
  document.getElementById('btnSignOut').onclick=async()=>{try{await api('POST','/api/auth/logout');}catch(e){} ME=null; location.hash='#/login'; route();};
}

/* ---------- auth pages ---------- */
function loginView(){
  const next=new URLSearchParams(location.hash.split('?')[1]||'').get('next')||'';
  view.innerHTML=`<div class="card narrow"><h3>Sign in</h3>
    <form id="f"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required>
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="actions"><button class="btn btn-primary" type="submit">Sign in</button></div>
    <div class="msg" id="m"></div></form>
    <div class="links"><a href="#/register">Create an account</a><a href="#/forgot">Forgot password?</a></div></div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault(); setMsg('m','');
    try{ await api('POST','/api/auth/login',{email:email.value,password:pw.value}); await loadMe();
      if(next && /^\/(m\/[A-Za-z0-9]{6,12}|report)$/.test(next)) location.href=next; else { location.hash='#/'; route(); } }
    catch(err){ setMsg('m',err.message); }
  };
}
async function registerView(){
  let mode='approval'; try{ mode=(await api('GET','/api/config')).registration; }catch(e){}
  if(mode==='invite'){ view.innerHTML=`<div class="card narrow"><h3>Sign-up is closed</h3><p>Ask an administrator for an invitation.</p><div class="links"><a href="#/login">Back to sign in</a></div></div>`; return; }
  view.innerHTML=`<div class="card narrow"><h3>Create an account</h3>
    <form id="f"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required>
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="new-password" minlength="10" required>
    <label for="pw2">Repeat password</label><input type="password" id="pw2" autocomplete="new-password" minlength="10" required>
    <p class="caption" style="margin-top:8px">At least 10 characters.${mode==='approval'?' After confirming your email, an administrator approves new accounts.':''}</p>
    <div class="actions"><button class="btn btn-primary" type="submit">Create account</button></div>
    <div class="msg" id="m"></div></form><div class="links"><a href="#/login">I already have an account</a></div></div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault(); setMsg('m','');
    if(pw.value!==pw2.value){ setMsg('m','The passwords do not match.'); return; }
    try{ await api('POST','/api/auth/register',{email:email.value,password:pw.value});
      document.getElementById('f').innerHTML=`<p class="msg ok">Check your inbox: we sent a link to confirm your email.</p>`; }
    catch(err){ setMsg('m',err.message); }
  };
}
async function verifyView(token){
  view.innerHTML=`<div class="card narrow"><h3>Confirming your email…</h3><div class="msg" id="m"></div><div class="links"><a href="#/login">Go to sign in</a></div></div>`;
  try{ const r=await api('POST','/api/auth/verify',{token});
    setMsg('m',r.status==='active'?'Email confirmed. You can sign in now.':'Email confirmed. An administrator will approve your account — you will get an email.',true); }
  catch(err){ setMsg('m',err.message); }
}
function forgotView(){
  view.innerHTML=`<div class="card narrow"><h3>Reset your password</h3>
    <form id="f"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required>
    <div class="actions"><button class="btn btn-primary" type="submit">Send reset link</button></div><div class="msg" id="m"></div></form>
    <div class="links"><a href="#/login">Back to sign in</a></div></div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault(); setMsg('m','');
    try{ await api('POST','/api/auth/forgot',{email:email.value}); setMsg('m','If an account exists for this email, a reset link is on its way.',true); }
    catch(err){ setMsg('m',err.message); }
  };
}
function resetView(token){
  view.innerHTML=`<div class="card narrow"><h3>Choose a new password</h3>
    <form id="f"><label for="pw">New password</label><input type="password" id="pw" autocomplete="new-password" minlength="10" required>
    <label for="pw2">Repeat password</label><input type="password" id="pw2" autocomplete="new-password" minlength="10" required>
    <div class="actions"><button class="btn btn-primary" type="submit">Save password</button></div><div class="msg" id="m"></div></form>
    <div class="links"><a href="#/login">Go to sign in</a></div></div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault(); setMsg('m','');
    if(pw.value!==pw2.value){ setMsg('m','The passwords do not match.'); return; }
    try{ await api('POST','/api/auth/reset',{token,password:pw.value});
      document.getElementById('f').innerHTML='<p class="msg ok">Password saved. You can sign in now.</p>'; }
    catch(err){ setMsg('m',err.message); }
  };
}

/* ---------- library ---------- */
let LIB={q:'',page:1};
async function libraryView(){
  const q=ME.quota||{};
  view.innerHTML=`${ME.sourcePaused?'<div class="notice">Reading new matches is paused (Flashscore refused our requests). Matches already in the library still open normally.</div>':''}
    <div class="section-title">New report</div>
    <div class="section-sub">Paste a Flashscore match link. Matches already in the library open instantly and do not count towards your limit.</div>
    <div class="card"><form id="fNew" class="row"><label for="url" class="hidden">Flashscore match link</label>
      <input type="url" id="url" placeholder="https://www.flashscore.com/match/football/…/?mid=…" autocomplete="off" spellcheck="false" required>
      <button class="btn btn-primary" type="submit" id="btnGo">Generate report</button></form>
      <div class="caption" style="margin-top:8px">${q.limit==null?'No daily limit (administrator).':`New matches today: ${esc(q.used)} of ${esc(q.limit)}.`}</div>
      <div class="progress hidden" id="prog"><div></div></div><div class="msg" id="m"></div></div>
    <div class="section-title">Library</div><div class="section-sub">Matches read by anyone in the team. Open one to see the dashboard and export the PDF.</div>
    <div class="card"><div class="row"><input type="search" id="q" placeholder="Search team or competition" value="${esc(LIB.q)}"></div>
      <div class="table-wrap" id="list" style="margin-top:12px"></div><div class="msg" id="lm"></div></div>`;
  document.getElementById('fNew').onsubmit=e=>{e.preventDefault(); generate(document.getElementById('url').value.trim());};
  let t=null; document.getElementById('q').oninput=e=>{clearTimeout(t); t=setTimeout(()=>{LIB={q:e.target.value,page:1}; loadList();},250);};
  loadList();
}
async function generate(url){
  setMsg('m',''); const prog=document.getElementById('prog'), bar=prog.firstElementChild, btn=document.getElementById('btnGo');
  if(!FLASH_URL_RE.test(url)){ setMsg('m','Paste a Flashscore football match link (https://www.flashscore.com/match/football/…?mid=…).'); return; }
  btn.disabled=true; prog.classList.remove('hidden'); bar.style.width='3%';
  try{
    let job=await api('POST','/api/matches',{url});
    const t0=Date.now();
    while(job.status!=='done'){
      if(job.status==='error'){ const e=job.error||{}; throw new Error((e.message||'Could not read that match.')+(e.hint?' '+e.hint:'')); }
      if(Date.now()-t0>240000) throw new Error('Timed out while reading the match.');
      await new Promise(r=>setTimeout(r,1000));
      job=await api('GET','/api/matches/'+encodeURIComponent(job.jobId));
      const p=job.progress||{}; if(p.total) bar.style.width=Math.max(3,Math.round(p.done/p.total*100))+'%';
      setMsg('m',p.message||'',true);
    }
    bar.style.width='100%'; location.href='/m/'+encodeURIComponent(job.mid);
  }catch(err){ setMsg('m',err.message); prog.classList.add('hidden'); }
  finally{ btn.disabled=false; }
}
async function loadList(){
  const box=document.getElementById('list'); if(!box) return;
  try{
    const d=await api('GET',`/api/library?q=${encodeURIComponent(LIB.q)}&page=${LIB.page}`);
    if(!d.items.length){ box.innerHTML=`<p class="caption">${LIB.q?'No matches found.':'The library is empty — generate the first report above.'}</p>`; return; }
    const pages=Math.max(1,Math.ceil(d.total/d.pageSize));
    box.innerHTML=`<table><thead><tr><th>Match</th><th class="hide-sm">Competition</th><th class="hide-sm">Kick-off</th><th class="hide-sm">Added by</th><th></th></tr></thead><tbody>${
      d.items.map(m=>`<tr data-mid="${esc(m.mid)}"><td><a class="match-name" href="/m/${encodeURIComponent(m.mid)}">${esc(m.home)}<span class="score">${esc(m.score||'vs')}</span>${esc(m.away)}</a></td>
        <td class="hide-sm">${esc(m.competition)}</td><td class="hide-sm">${esc(m.kickoff)}</td><td class="hide-sm caption">${esc(m.createdBy||'—')}</td>
        <td><div class="row" style="justify-content:flex-end">${m.canManage?`<button class="btn btn-sm" data-act="share">${m.shared?'Shared ✓':'Share'}</button>
          <button class="btn btn-sm" data-act="refresh" title="Read the match again from Flashscore">Refresh</button>`:''}</div></td></tr>`).join('')
    }</tbody></table><div class="pager"><span class="caption">${esc(d.total)} matches · page ${esc(d.page)} of ${pages}</span>
      <button class="btn btn-sm" id="prev" ${d.page<=1?'disabled':''}>Previous</button><button class="btn btn-sm" id="next" ${d.page>=pages?'disabled':''}>Next</button></div>`;
    document.getElementById('prev').onclick=()=>{LIB.page--;loadList();};
    document.getElementById('next').onclick=()=>{LIB.page++;loadList();};
    box.querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>libAction(b.closest('tr').dataset.mid,b.dataset.act,d.items.find(x=>x.mid===b.closest('tr').dataset.mid)));
  }catch(err){ setMsg('lm',err.message); }
}
async function libAction(mid,act,item){
  setMsg('lm','');
  try{
    if(act==='share'){
      if(item.shared){ if(!confirm('Turn off the public link? People who have it will no longer be able to open the report.')) return;
        await api('POST',`/api/library/${encodeURIComponent(mid)}/share`,{enabled:false}); setMsg('lm','Public link turned off.',true); }
      else{ const r=await api('POST',`/api/library/${encodeURIComponent(mid)}/share`,{enabled:true});
        const link=`${location.origin}/m/${encodeURIComponent(mid)}?s=${encodeURIComponent(r.shareToken)}`;
        try{ navigator.clipboard.writeText(link).catch(()=>{}); }catch(e){}   // không chờ: có thể treo khi chưa cấp quyền
        prompt('Public read-only link (copied). Anyone with this link can view this report without signing in:',link); }
    } else if(act==='refresh'){
      const job=await api('POST',`/api/library/${encodeURIComponent(mid)}/refresh`);
      setMsg('lm',job.status==='done'?'Already up to date.':'Refresh queued — the match will be read again in a moment.',true);
    }
    loadList();
  }catch(err){ setMsg('lm',err.message); }
}

/* ---------- account ---------- */
function accountView(){
  view.innerHTML=`<div class="section-title">Account</div><div class="section-sub">${esc(ME.user.email)}</div>
    <div class="card"><h3>Delete my account</h3><p class="caption">Removes your account and sign-in data. Matches you added stay in the team library.</p>
    <form id="f"><label for="pw">Confirm with your password</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="actions"><button class="btn" type="submit">Delete my account</button></div><div class="msg" id="m"></div></form></div>`;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault(); if(!confirm('Delete your account permanently?')) return;
    try{ await api('DELETE','/api/me',{password:pw.value}); ME=null; location.hash='#/login'; route(); }catch(err){ setMsg('m',err.message); }
  };
}

/* ---------- admin ---------- */
async function adminView(){
  view.innerHTML=`<div class="section-title">Administration</div><div class="section-sub">Accounts, sign-up, crawler status.</div>
    <div class="card"><h3>System</h3><div id="sys" class="caption">Loading…</div><div class="msg" id="sm"></div></div>
    <div class="card"><h3>Invite someone</h3><form id="fInv" class="row"><input type="email" id="invEmail" placeholder="email@example.com" required>
      <select id="invRole" style="width:auto"><option value="member">Member</option><option value="admin">Admin</option></select>
      <button class="btn btn-primary" type="submit">Send invitation</button></form><div class="msg" id="im"></div></div>
    <div class="card"><h3>Accounts</h3><div class="table-wrap" id="users"></div><div class="msg" id="um"></div></div>
    <div class="card"><h3>Activity</h3><div class="table-wrap" id="audit"></div></div>`;
  document.getElementById('fInv').onsubmit=async e=>{e.preventDefault(); setMsg('im','');
    try{ await api('POST','/api/admin/users',{email:invEmail.value,role:invRole.value}); setMsg('im','Invitation sent.',true); invEmail.value=''; loadUsers(); }
    catch(err){ setMsg('im',err.message); }};
  loadSystem(); loadUsers(); loadAudit();
}
async function loadSystem(){
  const box=document.getElementById('sys');
  try{
    const s=await api('GET','/api/admin/settings');
    const b=s.breaker||{}, paused=s.sourcePaused;
    box.innerHTML=`<div class="row"><label for="reg" style="margin:0">Sign-up</label>
      <select id="reg" style="width:auto"><option value="approval">Open, with approval</option><option value="open">Open, no approval</option><option value="invite">Invitation only</option></select></div>
      <p style="margin-top:12px">Worker: ${s.workerHeartbeatAgeS==null?'<span class="tag neg">never seen</span>':s.workerHeartbeatAgeS<60?'<span class="tag pos">running</span>':`<span class="tag neg">silent for ${esc(Math.round(s.workerHeartbeatAgeS))} s</span>`}
      · Queue: ${esc(s.queue.queued)} waiting, ${esc(s.queue.running)} running
      · Crawling: ${paused?`<span class="tag neg">paused${b.manual?' until resumed':''}</span> <button class="btn btn-sm" id="resume">Resume crawling</button>`:'<span class="tag pos">active</span>'}</p>
      <p class="caption" style="margin-top:8px">Limits: ${esc(s.quotas.userDaily)} new matches per user per day · ${esc(s.quotas.globalHourly)} per hour in total · queue ${esc(s.quotas.queueMax)} · email: ${esc(s.mailMode)}</p>`;
    const reg=document.getElementById('reg'); reg.value=s.registration;
    reg.onchange=async()=>{try{await api('POST','/api/admin/settings',{registration:reg.value}); setMsg('sm','Sign-up setting saved.',true);}catch(err){setMsg('sm',err.message);}};
    const resume=document.getElementById('resume');
    if(resume) resume.onclick=async()=>{try{await api('POST','/api/admin/settings',{resetBreaker:true}); loadSystem();}catch(err){setMsg('sm',err.message);}};
  }catch(err){ box.textContent=err.message; }
}
async function loadUsers(){
  const box=document.getElementById('users');
  try{
    const {users}=await api('GET','/api/admin/users');
    box.innerHTML=`<table><thead><tr><th>Email</th><th>Status</th><th>Role</th><th class="hide-sm">Daily limit</th><th class="hide-sm">Last sign-in</th><th></th></tr></thead><tbody>${
      users.map(u=>`<tr data-id="${esc(u.id)}"><td>${esc(u.email)}${u.id===ME.user.id?' <span class="caption">(you)</span>':''}</td>
        <td>${u.status==='active'?'<span class="tag pos">active</span>':u.status==='disabled'?'<span class="tag neg">disabled</span>':`<span class="tag neutral">${u.verified?'waiting for approval':'email not confirmed'}</span>`}</td>
        <td>${esc(u.role)}</td>
        <td class="hide-sm"><input type="number" min="0" max="1000" data-act="quota" value="${u.dailyQuota==null?'':esc(u.dailyQuota)}" placeholder="default" style="width:96px"></td>
        <td class="hide-sm caption">${fmtDate(u.lastLoginAt)||'—'}</td>
        <td><div class="row" style="justify-content:flex-end">${u.id===ME.user.id?'':`
          ${u.status!=='active'?`<button class="btn btn-sm" data-act="approve" ${u.verified?'':'disabled'}>${u.status==='disabled'?'Enable':'Approve'}</button>`:'<button class="btn btn-sm" data-act="disable">Disable</button>'}
          <button class="btn btn-sm" data-act="role">${u.role==='admin'?'Make member':'Make admin'}</button>`}</div></td></tr>`).join('')
    }</tbody></table>`;
    box.querySelectorAll('[data-act]').forEach(el=>{
      const id=+el.closest('tr').dataset.id, u=users.find(x=>x.id===id);
      const send=async changes=>{setMsg('um',''); try{await api('POST','/api/admin/users/'+id,changes); loadUsers();}catch(err){setMsg('um',err.message);}};
      if(el.dataset.act==='approve') el.onclick=()=>send({status:'active'});
      if(el.dataset.act==='disable') el.onclick=()=>{ if(confirm('Disable '+u.email+'? They will be signed out.')) send({status:'disabled'}); };
      if(el.dataset.act==='role') el.onclick=()=>send({role:u.role==='admin'?'member':'admin'});
      if(el.dataset.act==='quota') el.onchange=()=>send({dailyQuota:el.value===''?null:Math.max(0,Math.min(1000,parseInt(el.value,10)||0))});
    });
  }catch(err){ setMsg('um',err.message); }
}
async function loadAudit(){
  const box=document.getElementById('audit');
  try{ const {items}=await api('GET','/api/admin/audit?limit=50');
    box.innerHTML=items.length?`<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th class="hide-sm">Detail</th></tr></thead><tbody>${
      items.map(a=>`<tr><td class="caption">${esc(a.at.replace('T',' ').replace('Z',''))}</td><td>${esc(a.email||'—')}</td><td>${esc(a.action)}</td><td class="hide-sm caption">${esc(a.detail)}</td></tr>`).join('')}</tbody></table>`
      :'<p class="caption">No activity yet.</p>'; }
  catch(err){ box.textContent=err.message; }
}

/* ---------- router ---------- */
async function loadMe(){ try{ ME=await api('GET','/api/me'); }catch(e){ ME=null; } renderNav(); return ME; }
async function route(){
  const h=location.hash||'#/';
  const [path]=h.slice(1).split('?');
  let m;
  if((m=path.match(/^\/verify\/([\w-]+)$/))) return verifyView(m[1]);
  if((m=path.match(/^\/reset\/([\w-]+)$/))) return resetView(m[1]);
  if(path==='/register') return registerView();
  if(path==='/forgot') return forgotView();
  if(!ME) await loadMe();
  if(path==='/login'||!ME){ if(ME){ location.hash='#/'; return route(); } return loginView(); }
  if(path==='/admin'&&ME.user.role==='admin') return adminView();
  if(path==='/account') return accountView();
  await loadMe(); return libraryView();
}
window.addEventListener('hashchange',route);
route();
</script>
